apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "python-app.fullname" . }}
  labels:
    {{- include "python-app.labels" . | nindent 4 }}

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      {{- include "python-app.selectorLabels" . | nindent 6 }}

  template:
    metadata:
      labels:
        {{- include "python-app.selectorLabels" . | nindent 8 }}

    spec:
      serviceAccountName: {{ include "python-app.serviceAccountName" . }}

      containers:
        - name: python-app

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}

          # ✅ PRODUCTION: RESOURCE LIMITS
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"

          # ✅ HEALTH CHECKS (VERY IMPORTANT FOR INGRESS STABILITY)
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5

      restartPolicy: Always
